[project]
name = "skill-evolution"
version = "0.1.0"
description = "Out-of-band self-evolution system for Claude Code SKILL.md files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dspy-ai>=2.6.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
skill-evolution = "skill_evolution.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
